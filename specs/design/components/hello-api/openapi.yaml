openapi: 3.0.3
info:
  title: Hello World API
  version: 0.1.0
  description: A minimal public API that returns a fixed greeting message.
servers:
  - url: /
paths:
  /greeting:
    get:
      operationId: getGreeting
      summary: Get the fixed greeting message
      responses:
        '200':
          description: The greeting was returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Greeting:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: The fixed greeting text
          example: Hello, World!
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: HTTP or application error code
        message:
          type: string
          description: short human-readable label
        description:
          type: string
          description: detailed explanation
        moreInfo:
          type: string
          description: URI to documentation
